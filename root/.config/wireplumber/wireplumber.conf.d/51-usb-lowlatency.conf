monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_input.*AT2020USB.*" }
    ],
    actions = {
      update-props = {
        api.alsa.period-size = 64
        api.alsa.period-num = 2
        api.alsa.headroom = 0
      }
    }
  },
  {
    matches = [
      { node.name = "~alsa_output.*AT2020USB.*" }
    ],
    actions = {
      update-props = {
        node.disabled = true
      }
    }
  },
  {
    matches = [
      { node.name = "~alsa_output.*UAC.*" }
    ],
    actions = {
      update-props = {
        api.alsa.period-size = 64
        api.alsa.period-num = 2
        api.alsa.headroom = 0
      }
    }
  }
]
