monitor.alsa.rules = [
  {
    matches = [
      {
        api.alsa.path = "~hw:2.*"
      }
    ],
    actions = {
      update-props = {
        node.description = "UAC2 Gadget 1"
        node.nick = "UAC2-1"
      }
    }
  },
  {
    matches = [
      {
        api.alsa.path = "~hw:3.*"
      }
    ],
    actions = {
      update-props = {
        node.description = "UAC2 Gadget 2"
        node.nick = "UAC2-2"
      }
    }
  }
]
