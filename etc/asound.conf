# ========== Cards (by stable IDs) ==========
# card 0 ID: AT2020USB        (AT2020USB+ USB Audio)
# card 1 ID: sndrpihifiberry  (HiFiBerry DAC8x/ADC8x)
# card 2 ID: UAC2Gadget       (UAC2 Gadget, stereo)
# card 3 ID: UAC2Gadget_1     (UAC2 Gadget 2, stereo)

# ========== HiFiBerry DAC8x: 8-ch playback softvol ==========
pcm.dac8x_raw {
  type hw
  card sndrpihifiberry
  device 0
}

pcm.dac8x_softvol {
  type softvol
  slave.pcm "dac8x_raw"
  control {
    name "DAC8x Softvol"
    card sndrpihifiberry
  }
  min_dB -60.0
  max_dB 12.0
}

pcm.dac8x {
  type plug
  slave.pcm "dac8x_softvol"
}

# ========== UAC2 Gadget (Card 2): stereo playback softvol ==========
pcm.uac2_raw {
  type hw
  card UAC2Gadget
  device 0
}

pcm.uac2_softvol {
  type softvol
  slave.pcm "uac2_raw"
  control {
    name "UAC2 Softvol"
    card UAC2Gadget
  }
  channels 2
  min_dB -60.0
  max_dB 12.0
}

pcm.uac2 {
  type plug
  slave.pcm "uac2_softvol"
}

# ========== UAC2 Gadget 1 (Card 3): stereo playback softvol ==========
pcm.uac2_1_raw {
  type hw
  card UAC2Gadget_1
  device 0
}

pcm.uac2_1_softvol {
  type softvol
  slave.pcm "uac2_1_raw"
  control {
    name "UAC2_1 Softvol"
    card UAC2Gadget_1
  }
  channels 2
  min_dB -60.0
  max_dB 12.0
}

pcm.uac2_1 {
  type plug
  slave.pcm "uac2_1_softvol"
}

# ========== Default control interface ==========
# Forces alsamixer to target the HiFiBerry card by its stable ID
ctl.!default {
  type hw
  card sndrpihifiberry
}

# ========== Optional: set a default playback PCM ==========
# Uncomment below if you want system "default" audio to go to the HiFiBerry 8ch softvol:
# pcm.!default {
#   type asym
#   playback.pcm "dac8x"
#   capture.pcm "hw:AT2020USB,0"
# }
