# ========== Cards (by stable IDs) ==========
# From your aplay -l:
#   card 0 ID: sndrpihifiberry  (HiFiBerry DAC8x/ADC8x)
#   card 1 ID: UAC2Gadget       (UAC2 Gadget, stereo)

# ========== HiFiBerry DAC8x: 8-ch playback softvol ==========
pcm.dac8x_raw {
  type hw
  card sndrpihifiberry
  device 0
}

pcm.dac8x_softvol {
  type softvol
  slave.pcm "dac8x_raw"
  control {
    name "DAC8x Softvol"
    card sndrpihifiberry
  }
  min_dB -60.0
  max_dB 12.0
}

# Wrap in 'plug' so formats/rates convert automatically
pcm.dac8x {
  type plug
  slave.pcm "dac8x_softvol"
}

# ========== UAC2 Gadget: stereo playback softvol ==========
pcm.uac2_raw {
  type hw
  card UAC2Gadget
  device 0
}

pcm.uac2_softvol {
  type softvol
  slave.pcm "uac2_raw"
  control {
    name "UAC2 Softvol"
    card UAC2Gadget
  }
  channels 2
  min_dB -60.0
  max_dB 12.0
}

pcm.uac2 {
  type plug
  slave.pcm "uac2_softvol"
}

# ========== Default control interface ==========
# Use the HiFiBerry card by default for 'alsamixer' (you can switch to the UAC2 card with F6).
ctl.!default {
  type hw
  card sndrpihifiberry
}

# ========== Optional: set a default PCM ==========
# If you want all "default" playback to go through the 8ch softvol:
# pcm.!default {
#   type asym
#   playback.pcm "dac8x"
#   capture.pcm  "hw:sndrpihifiberry,0"  # or "hw:UAC2Gadget,0" if you prefer
# }
