<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CM5 Audio Network Patchbay</title>
    <style>
        :root {
            --bg-color: #0f111a;
            --panel-bg: #1a1c23;
            --border-color: #2e3440;
            --text-main: #eceff4;
            --text-dim: #d8dee9;
            --accent-blue: #88c0d0;
            --accent-green: #a3be8c;
            --accent-red: #bf616a;
            --accent-yellow: #ebcb8b;
            --highlight: #5e81ac;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: var(--bg-color);
            color: var(--text-main);
            font: 13px 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        header {
            background: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 10px 15px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            z-index: 100;
        }
        .brand-area { display: flex; align-items: center; gap: 15px; }
        .brand { font-size: 16px; font-weight: bold; color: var(--accent-blue); white-space: nowrap; }

        .tabs {
            display: flex;
            background: var(--bg-color);
            border-radius: 4px;
            padding: 2px;
            border: 1px solid var(--border-color);
        }
        .tab-btn {
            background: transparent;
            color: var(--text-dim);
            border: none;
            padding: 6px 14px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.2s;
        }
        .tab-btn.active {
            background: var(--highlight);
            color: #fff;
        }

        .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        button {
            background: #4c566a;
            color: #fff;
            border: 0;
            border-radius: 4px;
            padding: 8px 12px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: background 0.2s;
            min-height: 36px;
        }
        button:hover { background: var(--highlight); }
        button.primary { background: var(--highlight); }
        button:disabled { opacity: 0.4; cursor: wait; }
        #status { font-size: 11px; color: var(--text-dim); }

        main {
            display: flex;
            flex: 1;
            position: relative;
            overflow: hidden;
        }
        .tab-content {
            display: none;
            flex: 1;
            position: relative;
            overflow: hidden;
            width: 100%;
            height: 100%;
        }
        .tab-content.active {
            display: flex;
            flex-direction: column;
        }

        /* Patchbay View with Isolated Pan & Zoom */
        #patchbay-toolbar {
            background: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 6px 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 20;
        }
        #patchbay {
            flex: 1;
            position: relative;
            overflow: hidden;
            touch-action: none;
            background: radial-gradient(circle, #1a1c23 1px, transparent 1px);
            background-size: 30px 30px;
            cursor: grab;
        }
        #patchbay:active { cursor: grabbing; }

        #patchbay-viewport {
            position: absolute;
            top: 0;
            left: 0;
            display: flex;
            justify-content: space-between;
            padding: 60px;
            min-width: 2500px;
            min-height: 2000px;
            transform-origin: 0 0;
            will-change: transform;
        }

        .column {
            display: flex;
            flex-direction: column;
            gap: 25px;
            z-index: 5;
            width: 260px;
        }
        .endpoint-block {
            background: var(--panel-bg);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 10px;
            width: 100%;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            cursor: default;
            position: relative;
            user-select: none;
            transition: border-color 0.2s;
        }
        .endpoint-block.active-block { border-color: var(--accent-blue); }
        .endpoint-header {
            font-weight: bold;
            margin-bottom: 8px;
            text-align: center;
            color: var(--text-dim);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 5px;
            font-size: 12px;
            word-break: break-all;
            cursor: grab;
        }
        .endpoint-header:active { cursor: grabbing; }
        .channel-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 4px 0;
            padding: 6px;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.1s, outline 0.1s;
            user-select: none;
            min-height: 32px;
        }
        .channel-row:hover { background: rgba(255,255,255,0.05); }
        .channel-row.selected { background: rgba(136, 192, 208, 0.25); outline: 1px solid var(--accent-blue); }
        .channel-row.snapped { background: rgba(163, 190, 140, 0.35); outline: 2px solid var(--accent-green); }
        .ch-label { width: 34px; font-family: monospace; font-size: 11px; color: var(--text-dim); }
        .vu-container {
            flex: 1;
            height: 12px;
            background: #000;
            border-radius: 2px;
            position: relative;
            overflow: hidden;
            pointer-events: none;
        }
        .vu-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent-green) 70%, var(--accent-yellow) 85%, var(--accent-red) 100%);
            transition: width 0.1s;
        }
        .vu-peak {
            position: absolute;
            right: 0;
            top: 0;
            bottom: 0;
            width: 2px;
            background: white;
            opacity: 0;
        }
        .vu-peak.active { opacity: 1; }
        #cable-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 5000px;
            height: 5000px;
            pointer-events: none;
            z-index: 1;
        }
        .cable {
            fill: none;
            stroke-width: 3;
            stroke-linecap: round;
            transition: stroke 0.3s;
            cursor: pointer;
            pointer-events: all;
        }
        .cable:hover { stroke-width: 6; }
        .cable-fx {
            filter: drop-shadow(0 0 4px var(--accent-blue));
        }
        .temp-cable {
            fill: none;
            stroke: var(--accent-green);
            stroke-width: 3;
            stroke-dasharray: 6 4;
            stroke-linecap: round;
            pointer-events: none;
        }

        /* Controls / Hardware View */
        .controls-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            align-content: start;
        }
        .panel-card {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .panel-card h2 {
            font-size: 14px;
            margin: 0 0 5px;
            color: var(--accent-blue);
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .control-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }
        .control-row label { color: var(--text-dim); font-size: 12px; }
        input[type="number"], select, input[type="text"] {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 6px 8px;
            border-radius: 4px;
            width: 120px;
            font-size: 13px;
        }
        .device-item {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 10px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }
        .device-item.active { border-color: var(--accent-green); }
        .device-info { display: flex; flex-direction: column; overflow: hidden; }
        .device-name { font-weight: bold; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .device-id { font-size: 10px; color: var(--text-dim); font-family: monospace; }

        /* Inspector Modal / DSP Chain Styles */
        #route-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--panel-bg);
            border: 1px solid var(--accent-blue);
            padding: 20px;
            border-radius: 8px;
            z-index: 1000;
            display: none;
            width: 90%;
            max-width: 520px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
        }
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            z-index: 999;
            display: none;
        }
        .dsp-section {
            margin-top: 15px;
            border-top: 1px solid var(--border-color);
            padding-top: 12px;
        }
        .dsp-chain-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin: 10px 0;
            max-height: 250px;
            overflow-y: auto;
            padding-right: 4px;
        }
        .dsp-processor-card {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            position: relative;
        }
        .dsp-processor-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            color: var(--accent-blue);
            font-size: 12px;
        }
        .dsp-processor-params {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            font-size: 11px;
        }
        .dsp-processor-params .control-row {
            margin: 0;
        }
        .dsp-processor-params input {
            width: 70px;
        }
        .chain-arrow {
            text-align: center;
            color: var(--text-dim);
            font-size: 14px;
            line-height: 8px;
        }
        .remove-btn {
            background: var(--accent-red);
            padding: 2px 6px;
            font-size: 10px;
            min-height: auto;
        }
        #error-overlay {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--accent-red);
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            z-index: 2000;
            display: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="error-overlay"></div>
    <header>
        <div class="brand-area">
            <div class="brand">CM5 AUDIO PATCHBAY</div>
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('patchbay')">Patchbay</button>
                <button class="tab-btn" onclick="switchTab('controls')">Hardware & DSP</button>
            </div>
        </div>
        <div class="toolbar">
            <span id="status">Ready</span>
            <button onclick="refreshAll()">REFRESH</button>
            <button onclick="resetClips()">RESET CLIPS</button>
            <button class="primary" onclick="saveSettings()">SAVE</button>
        </div>
    </header>

    <main>
        <!-- Tab 1: Patchbay / Routing View -->
        <div id="tab-patchbay" class="tab-content active">
            <div id="patchbay-toolbar">
                <span style="font-size: 11px; color: var(--text-dim);">Canvas Zoom:</span>
                <button onclick="zoomIn()" style="padding: 4px 10px; min-height: 28px;">+</button>
                <span id="zoom-indicator" style="font-size: 11px; min-width: 40px; text-align: center; color: var(--accent-blue); font-weight: bold;">100%</span>
                <button onclick="zoomOut()" style="padding: 4px 10px; min-height: 28px;">-</button>
                <button onclick="resetZoom()" style="padding: 4px 10px; min-height: 28px;">RESET</button>
                <button onclick="resetNodePositions()" style="padding: 4px 10px; min-height: 28px; background: #4c566a; margin-left: 10px;">RESET POSITIONS</button>
            </div>
            <div id="patchbay">
                <div id="patchbay-viewport">
                    <svg id="cable-svg">
                        <path id="temp-cable" class="temp-cable" d="" style="display: none;"></path>
                    </svg>
                    <div class="column" id="sources"></div>
                    <div class="column" id="destinations"></div>
                </div>
            </div>
        </div>

        <!-- Tab 2: Hardware Manager, Tone Generator, Global DSP & System Info -->
        <div id="tab-controls" class="tab-content">
            <div class="controls-container">
                <div class="panel-card">
                    <h2 style="color: var(--accent-green)">Hardware Manager</h2>
                    <div id="device-list">Loading devices...</div>
                </div>

                <div class="panel-card">
                    <h2>Tone Generator</h2>
                    <div class="control-group">
                        <div class="control-row">
                            <label>Enabled</label>
                            <select id="tone-enabled"><option value="0">OFF</option><option value="1">ON</option></select>
                        </div>
                        <div class="control-row">
                            <label>Freq (Hz)</label>
                            <input type="number" id="tone-freq" value="440">
                        </div>
                        <div class="control-row">
                            <label>Amp</label>
                            <input type="number" id="tone-amp" step="0.01" value="0.2">
                        </div>
                        <button onclick="applyTone()">APPLY TONE</button>
                    </div>
                </div>

                <div class="panel-card">
                    <h2>Global DSP</h2>
                    <div class="control-group">
                        <div class="control-row">
                            <label>Master Gain</label>
                            <input type="number" id="dsp-gain" step="0.1" value="1.0">
                        </div>
                        <button onclick="applyDSP()">UPDATE DSP</button>
                    </div>
                </div>

                <div class="panel-card">
                    <h2>System Info</h2>
                    <div id="sys-info" style="font-size: 12px; color: var(--text-dim); line-height: 1.6;">Loading endpoints...</div>
                </div>
            </div>
        </div>
    </main>

    <div class="modal-overlay" id="overlay" onclick="closeModal()"></div>
    <div id="route-modal">
        <h2 style="margin-top:0; font-size: 15px; color: var(--accent-blue)">Route Inspector & DSP Chain</h2>
        <div id="route-info" style="margin-bottom: 12px; font-family: monospace; font-size: 11px; word-break: break-all;"></div>
        
        <div class="control-group">
            <div class="control-row">
                <label>Route Gain</label>
                <input type="number" id="modal-gain" step="0.01">
            </div>
            <div class="control-row">
                <label>Route Enabled</label>
                <select id="modal-enabled"><option value="1">ON</option><option value="0">OFF</option></select>
            </div>
        </div>

        <div class="dsp-section">
            <div class="control-row" style="margin-bottom: 8px;">
                <label style="font-weight: bold; color: var(--accent-blue);">DSP Block Active</label>
                <select id="modal-dsp-active" onchange="onDspActiveChange()">
                    <option value="true">ACTIVE</option>
                    <option value="false">BYPASS</option>
                </select>
            </div>
            <div class="control-row" style="margin-bottom: 10px;">
                <label>DSP Master Gain</label>
                <input type="number" id="modal-dsp-gain" step="0.01" onchange="onDspGainChange()">
            </div>
            
            <label style="font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px;">Processor Chain</label>
            <div id="dsp-chain-list" class="dsp-chain-container"></div>

            <div class="control-row" style="margin-top: 10px; gap: 8px;">
                <select id="new-processor-type" style="flex: 1;">
                    <option value="gain">Gain</option>
                    <option value="compressor">Compressor</option>
                    <option value="eq">EQ Filter</option>
                    <option value="limiter">Limiter</option>
                    <option value="passthrough">Passthrough</option>
                </select>
                <button onclick="addProcessorToChain()">Add to Chain</button>
            </div>
        </div>

        <div class="toolbar" style="justify-content: flex-end; margin-top: 18px; border-top: 1px solid var(--border-color); padding-top: 12px;">
            <button onclick="closeModal()">CANCEL</button>
            <button class="primary" onclick="saveRoute()">APPLY</button>
            <button style="background: var(--accent-red)" onclick="deleteRoute()">DELETE ROUTE</button>
        </div>
    </div>

    <script>
        const $ = id => document.getElementById(id);
        let graph = { endpoints: [], routes: [] };
        let activeSource = null;
        let editingRouteId = null;
        let activeTabName = 'patchbay';

        // Endpoint Map Lookup (Bypasses CSS special character selector bugs)
        let endpointBlocks = new Map();

        // DSP Chain Local State for Route Inspector
        let currentRouteDspState = {
            active: false,
            gain: 1.0,
            chain: []
        };

        // Node Positions (Draggable Windows) State
        let nodePositions = JSON.parse(localStorage.getItem('cm5_node_positions') || '{}');
        let activeDraggedNode = null;
        let nodeDragStart = { mouseX: 0, mouseY: 0, startX: 0, startY: 0 };

        // Desktop Drag-to-Wire State
        let isWiringDrag = false;
        let wiringSource = null;
        let snappedDestination = null;

        // High-Performance Meter Cache (Fixes DOM Thrashing)
        let cachedMeters = [];

        // Isolated Pan & Zoom State
        let scale = 1.0;
        let panX = 0;
        let panY = 0;
        let isInitialFitDone = false;
        let isDragging = false;
        let startX = 0, startY = 0;
        let touchStartDist = 0;
        let touchStartScale = 1;
        let touchStartPanX = 0, touchStartPanY = 0;
        let touchCenter = { x: 0, y: 0 };

        function updateTransform() {
            const viewport = $('patchbay-viewport');
            viewport.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
            $('zoom-indicator').textContent = Math.round(scale * 100) + '%';
            drawCables();
        }

        function autoFitViewport() {
            if (isInitialFitDone) return;
            const viewport = $('patchbay-viewport');
            const container = $('patchbay');
            if (!viewport || !container) return;

            viewport.style.transform = 'translate(0px, 0px) scale(1)';
            const blocks = viewport.querySelectorAll('.endpoint-block');
            if (blocks.length === 0) return;

            const containerRect = container.getBoundingClientRect();
            let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;

            blocks.forEach(block => {
                const rect = block.getBoundingClientRect();
                const relX = rect.left - containerRect.left;
                const relY = rect.top - containerRect.top;
                minX = Math.min(minX, relX);
                minY = Math.min(minY, relY);
                maxX = Math.max(maxX, relX + block.offsetWidth);
                maxY = Math.max(maxY, relY + block.offsetHeight);
            });

            const margin = 50;
            const contentWidth = maxX - minX;
            const contentHeight = maxY - minY;
            if (contentWidth <= 0 || contentHeight <= 0) return;

            const containerWidth = container.clientWidth;
            const containerHeight = container.clientHeight;
            const scaleX = (containerWidth - margin * 2) / contentWidth;
            const scaleY = (containerHeight - margin * 2) / contentHeight;

            scale = Math.max(0.2, Math.min(1.5, Math.min(scaleX, scaleY)));
            panX = (containerWidth - contentWidth * scale) / 2 - minX * scale;
            panY = (containerHeight - contentHeight * scale) / 2 - minY * scale;

            isInitialFitDone = true;
            updateTransform();
        }

        function zoomIn() { scale = Math.min(3.5, scale * 1.2); updateTransform(); }
        function zoomOut() { scale = Math.max(0.2, scale / 1.2); updateTransform(); }
        function resetZoom() { isInitialFitDone = false; autoFitViewport(); }
        function resetNodePositions() {
            localStorage.removeItem('cm5_node_positions');
            nodePositions = {};
            endpointBlocks.forEach(b => {
                b.style.transform = '';
            });
            isInitialFitDone = false;
            autoFitViewport();
            drawCables();
        }

        const patchbay = $('patchbay');

        patchbay.addEventListener('wheel', e => {
            e.preventDefault();
            const zoomFactor = e.deltaY < 0 ? 1.12 : 0.88;
            const newScale = Math.max(0.2, Math.min(3.5, scale * zoomFactor));
            const rect = patchbay.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            panX = mouseX - (mouseX - panX) * (newScale / scale);
            panY = mouseY - (mouseY - panY) * (newScale / scale);
            scale = newScale;
            updateTransform();
        }, { passive: false });

        patchbay.addEventListener('pointerdown', e => {
            if (e.target.closest('.endpoint-block') || e.target.closest('.cable') || e.target.closest('button')) return;
            isDragging = true;
            startX = e.clientX - panX;
            startY = e.clientY - panY;
            patchbay.setPointerCapture(e.pointerId);
        });

        patchbay.addEventListener('pointermove', e => {
            if (isDragging) {
                panX = e.clientX - startX;
                panY = e.clientY - startY;
                updateTransform();
                return;
            }

            if (activeDraggedNode) {
                const dx = (e.clientX - nodeDragStart.mouseX) / scale;
                const dy = (e.clientY - nodeDragStart.mouseY) / scale;
                const newX = nodeDragStart.startX + dx;
                const newY = nodeDragStart.startY + dy;

                activeDraggedNode.style.transform = `translate(${newX}px, ${newY}px)`;
                nodePositions[activeDraggedNode.dataset.epId] = { x: newX, y: newY };
                drawCables();
                return;
            }

            if (isWiringDrag && wiringSource) {
                const viewportRect = $('patchbay-viewport').getBoundingClientRect();
                const mouseX = (e.clientX - viewportRect.left) / scale;
                const mouseY = (e.clientY - viewportRect.top) / scale;

                const srcEl = $(`slot-${wiringSource.endpointId}-${wiringSource.channel}`);
                if (!srcEl) return;
                const srcRect = srcEl.getBoundingClientRect();
                const x1 = (srcRect.right - viewportRect.left) / scale;
                const y1 = (srcRect.top + srcRect.height/2 - viewportRect.top) / scale;

                const tempCable = $('temp-cable');
                tempCable.style.display = 'block';
                const cp1x = x1 + (mouseX - x1) * 0.5;
                const cp2x = x1 + (mouseX - x1) * 0.5;
                tempCable.setAttribute('d', `M ${x1} ${y1} C ${cp1x} ${y1}, ${cp2x} ${mouseY}, ${mouseX} ${mouseY}`);

                let closestDest = null;
                let minDist = 45;

                document.querySelectorAll('#destinations .channel-row').forEach(row => {
                    const rowRect = row.getBoundingClientRect();
                    const rowCenterX = (rowRect.left + rowRect.width / 2 - viewportRect.left) / scale;
                    const rowCenterY = (rowRect.top + rowRect.height / 2 - viewportRect.top) / scale;
                    const dist = Math.hypot(mouseX - rowCenterX, mouseY - rowCenterY);

                    if (dist < minDist) {
                        minDist = dist;
                        closestDest = row;
                    }
                });

                document.querySelectorAll('.channel-row.snapped').forEach(r => r.classList.remove('snapped'));
                if (closestDest) {
                    closestDest.classList.add('snapped');
                    const parts = closestDest.id.replace('slot-', '').split('-');
                    const ch = parseInt(parts.pop());
                    const epId = parts.join('-');
                    snappedDestination = { endpointId: epId, channel: ch };
                } else {
                    snappedDestination = null;
                }
            }
        });

        patchbay.addEventListener('pointerup', e => {
            isDragging = false;
            try { patchbay.releasePointerCapture(e.pointerId); } catch(err){}

            if (activeDraggedNode) {
                localStorage.setItem('cm5_node_positions', JSON.stringify(nodePositions));
                activeDraggedNode = null;
            }

            if (isWiringDrag) {
                $('temp-cable').style.display = 'none';
                document.querySelectorAll('.channel-row.snapped').forEach(r => r.classList.remove('snapped'));

                if (snappedDestination && wiringSource) {
                    createRoute(wiringSource.endpointId, wiringSource.channel, snappedDestination.endpointId, snappedDestination.channel);
                }
                isWiringDrag = false;
                wiringSource = null;
                snappedDestination = null;
            }
        });

        patchbay.addEventListener('touchstart', e => {
            if (e.target.closest('.endpoint-block') || e.target.closest('button')) return;
            if (e.touches.length === 2) {
                e.preventDefault();
                touchStartDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
                touchStartScale = scale;
                touchStartPanX = panX;
                touchStartPanY = panY;
                const rect = patchbay.getBoundingClientRect();
                touchCenter = {
                    x: (e.touches[0].clientX + e.touches[1].clientX) / 2 - rect.left,
                    y: (e.touches[0].clientY + e.touches[1].clientY) / 2 - rect.top
                };
            }
        }, { passive: false });

        patchbay.addEventListener('touchmove', e => {
            if (e.touches.length === 2) {
                e.preventDefault();
                const dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
                if (touchStartDist > 0) {
                    const newScale = Math.max(0.2, Math.min(3.5, touchStartScale * (dist / touchStartDist)));
                    panX = touchCenter.x - (touchCenter.x - touchStartPanX) * (newScale / touchStartScale);
                    panY = touchCenter.y - (touchCenter.y - touchStartPanY) * (newScale / touchStartScale);
                    scale = newScale;
                    updateTransform();
                }
            }
        }, { passive: false });

        function switchTab(tabName) {
            activeTabName = tabName;
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));

            if (tabName === 'patchbay') {
                $('tab-patchbay').classList.add('active');
                document.querySelector('.tab-btn:nth-child(1)').classList.add('active');
                setTimeout(drawCables, 50);
            } else if (tabName === 'controls') {
                $('tab-controls').classList.add('active');
                document.querySelector('.tab-btn:nth-child(2)').classList.add('active');
            }
        }

        function showError(msg) {
            const el = $('error-overlay');
            el.textContent = msg;
            el.style.display = 'block';
            setTimeout(() => { el.style.display = 'none'; }, 5000);
        }

        async function fetchAPI(url, options = {}) {
            const absoluteUrl = url.startsWith('/') ? url : '/' + url;
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), 5000);
            try {
                const res = await fetch(absoluteUrl, { ...options, signal: controller.signal });
                clearTimeout(timeout);
                if (!res.ok) throw new Error(`HTTP ${res.status}: ${await res.text()}`);
                return await res.json();
            } catch (e) {
                clearTimeout(timeout);
                throw e;
            }
        }

        async function loadDevices() {
            try {
                const devices = await fetchAPI('/api/devices');
                const graphData = await fetchAPI('/api/graph');
                const activeIds = new Set(graphData.endpoints.filter(e => e.id.startsWith('hardware/')).map(e => e.id.replace('hardware/', '').replace('/capture', '').replace('/playback', '')));
                $('device-list').innerHTML = devices.map(dev => `
                    <div class="device-item ${activeIds.has(dev.id) ? 'active' : ''}">
                        <div class="device-info">
                            <span class="device-name">${dev.name}</span>
                            <span class="device-id">${dev.id}</span>
                        </div>
                        <button onclick="toggleDevice('${dev.id}', ${activeIds.has(dev.id)})">
                            ${activeIds.has(dev.id) ? 'DEACTIVATE' : 'ACTIVATE'}
                        </button>
                    </div>
                `).join('') || 'No devices found';
            } catch (e) {
                $('device-list').textContent = 'Error loading devices: ' + e.message;
                showError('Failed to load hardware devices');
            }
        }

        async function toggleDevice(id, isActive) {
            const endpoint = isActive ? '/api/devices/deactivate' : '/api/devices/activate';
            try {
                await fetchAPI(`${endpoint}?id=${encodeURIComponent(id)}`, { method: 'POST' });
                await loadDevices();
                await loadGraph();
            } catch (e) {
                alert('Device action failed: ' + e.message);
            }
        }

        async function loadGraph() {
            try {
                graph = await fetchAPI('/api/graph');
                renderPatchbay();
                updateSysInfo();
                if (!isInitialFitDone) {
                    setTimeout(autoFitViewport, 50);
                }
            } catch (e) {
                console.error('Graph load failed', e);
                showError('Failed to load routing graph');
            }
        }

        function updateSysInfo() {
            $('sys-info').innerHTML = `<b>Endpoints:</b> ${graph.endpoints.length}<br><b>Active Routes:</b> ${graph.routes.length}`;
            $('status').textContent = 'Connected';
        }

        function rebuildMeterCache() {
            cachedMeters = [];
            graph.endpoints.forEach(ep => {
                for (let i = 0; i < ep.channels; i++) {
                    const fill = document.getElementById(`vu-${ep.id}-${i}`);
                    const peak = document.getElementById(`peak-${ep.id}-${i}`);
                    if (fill) {
                        cachedMeters.push({ epId: ep.id, ch: i, fillEl: fill, peakEl: peak });
                    }
                }
            });
        }

        function renderPatchbay() {
            const srcCont = $('sources');
            const destCont = $('destinations');
            const currentEndpoints = new Set(graph.endpoints.map(e => e.id));

            // Clean up removed endpoints from DOM and Map
            [srcCont, destCont].forEach(cont => {
                Array.from(cont.children).forEach(child => {
                    const id = child.dataset.epId;
                    if (!currentEndpoints.has(id)) {
                        endpointBlocks.delete(id);
                        child.style.opacity = '0';
                        child.style.transform = 'scale(0.8)';
                        setTimeout(() => child.remove(), 300);
                    }
                });
            });

            // Update or create blocks using endpointBlocks Map lookup
            graph.endpoints.forEach(ep => {
                let block = endpointBlocks.get(ep.id);
                if (!block) {
                    block = createEndpointBlock(ep);
                    if (ep.direction === 'source') srcCont.appendChild(block);
                    else destCont.appendChild(block);
                } else {
                    block.querySelector('.endpoint-header').textContent = ep.name || ep.id;
                }
            });

            rebuildMeterCache();

            if (activeTabName === 'patchbay') {
                setTimeout(drawCables, 50);
            }
        }

        function createEndpointBlock(ep) {
            const block = document.createElement('div');
            block.className = 'endpoint-block';
            block.id = `block-${ep.id}`;
            block.dataset.epId = ep.id;

            if (nodePositions[ep.id]) {
                block.style.transform = `translate(${nodePositions[ep.id].x}px, ${nodePositions[ep.id].y}px)`;
            }

            const header = document.createElement('div');
            header.className = 'endpoint-header';
            header.textContent = ep.name || ep.id;

            header.addEventListener('pointerdown', e => {
                if (e.button !== 0) return;
                activeDraggedNode = block;
                const currentPos = nodePositions[ep.id] || { x: 0, y: 0 };
                nodeDragStart = {
                    mouseX: e.clientX,
                    mouseY: e.clientY,
                    startX: currentPos.x,
                    startY: currentPos.y
                };
                header.setPointerCapture(e.pointerId);
                e.stopPropagation();
            });

            header.addEventListener('pointerup', e => {
                try { header.releasePointerCapture(e.pointerId); } catch(err){}
            });

            block.appendChild(header);

            for (let i = 0; i < ep.channels; i++) {
                const row = document.createElement('div');
                row.className = 'channel-row';
                row.id = `slot-${ep.id}-${i}`;
                row.innerHTML = `<span class="ch-label">CH${i+1}</span><div class="vu-container"><div class="vu-fill" id="vu-${ep.id}-${i}"></div><div class="vu-peak" id="peak-${ep.id}-${i}"></div></div>`;
                
                row.onclick = () => handleSlotClick(ep, i);

                if (ep.direction === 'source') {
                    row.addEventListener('pointerdown', e => {
                        if (e.button !== 0) return;
                        isWiringDrag = true;
                        wiringSource = { endpointId: ep.id, channel: i };
                        
                        document.querySelectorAll('.channel-row.selected').forEach(el => el.classList.remove('selected'));
                        row.classList.add('selected');
                        activeSource = { endpointId: ep.id, channel: i };
                        
                        patchbay.setPointerCapture(e.pointerId);
                        e.stopPropagation();
                    });
                }

                block.appendChild(row);
            }

            endpointBlocks.set(ep.id, block);
            return block;
        }

        function handleSlotClick(ep, ch) {
            const row = $(`slot-${ep.id}-${ch}`);
            if (ep.direction === 'source') {
                document.querySelectorAll('.channel-row.selected').forEach(el => el.classList.remove('selected'));
                row.classList.add('selected');
                activeSource = { endpointId: ep.id, channel: ch };
            } else if (ep.direction === 'destination' && activeSource) {
                createRoute(activeSource.endpointId, activeSource.channel, ep.id, ch);
                document.querySelectorAll('.channel-row.selected').forEach(el => el.classList.remove('selected'));
                activeSource = null;
            }
        }

        async function createRoute(srcId, srcCh, destId, destCh) {
            try {
                await fetchAPI('/api/routes', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        source: srcId,
                        source_ch: srcCh,
                        destination: destId,
                        destination_ch: destCh,
                        gain: 1.0,
                        enabled: true
                    })
                });
                await loadGraph();
            } catch (e) {
                alert('Routing failed: ' + e.message);
            }
        }

        function drawCables() {
            if (activeTabName !== 'patchbay') return;
            const svg = $('cable-svg');
            const tempCable = $('temp-cable');
            svg.innerHTML = '';
            if (tempCable) svg.appendChild(tempCable);

            const viewportRect = $('patchbay-viewport').getBoundingClientRect();

            graph.routes.forEach(route => {
                const srcEl = $(`slot-${route.source}-${route.source_channel}`);
                const destEl = $(`slot-${route.destination}-${route.destination_channel}`);
                if (!srcEl || !destEl) return;

                const srcRect = srcEl.getBoundingClientRect();
                const destRect = destEl.getBoundingClientRect();

                const x1 = (srcRect.right - viewportRect.left) / scale;
                const y1 = (srcRect.top + srcRect.height/2 - viewportRect.top) / scale;
                const x2 = (destRect.left - viewportRect.left) / scale;
                const y2 = (destRect.top + destRect.height/2 - viewportRect.top) / scale;

                const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                const cp1x = x1 + (x2 - x1) * 0.5;
                const cp2x = x1 + (x2 - x1) * 0.5;
                path.setAttribute('d', `M ${x1} ${y1} C ${cp1x} ${y1}, ${cp2x} ${y2}, ${x2} ${y2}`);
                path.setAttribute('class', 'cable');
                
                let strokeColor = route.enabled ? 'var(--accent-blue)' : 'var(--accent-red)';
                path.setAttribute('stroke', strokeColor);
                
                if (route.dsp_active) {
                    path.classList.add('cable-fx');
                }

                path.onclick = () => openRouteModal(route);
                svg.appendChild(path);
            });
        }

        async function openRouteModal(route) {
            editingRouteId = route.id;
            $('route-info').textContent = `${route.source} (CH${route.source_channel + 1}) \u2192 ${route.destination} (CH${route.destination_channel + 1})`;
            $('modal-gain').value = route.gain;
            $('modal-enabled').value = route.enabled ? '1' : '0';

            try {
                const dspData = await fetchAPI(`/api/routes/${route.id}/dsp`);
                currentRouteDspState = {
                    active: !!dspData.active,
                    gain: dspData.gain !== undefined ? dspData.gain : 1.0,
                    chain: Array.isArray(dspData.chain) ? dspData.chain : []
                };
            } catch (e) {
                currentRouteDspState = { active: false, gain: 1.0, chain: [] };
            }

            $('modal-dsp-active').value = currentRouteDspState.active ? 'true' : 'false';
            $('modal-dsp-gain').value = currentRouteDspState.gain;
            renderDspChain();

            $('overlay').style.display = 'block';$('route-modal').style.display = 'block';
        }

        function closeModal() {
            editingRouteId = null;
            $('overlay').style.display = 'none';$('route-modal').style.display = 'none';
        }

        function renderDspChain() {
            const container = $('dsp-chain-list');
            if (!container) return;

            if (currentRouteDspState.chain.length === 0) {
                container.innerHTML = '<div style="font-size: 11px; color: var(--text-dim); text-align: center; padding: 10px;">No processors in chain.</div>';
                return;
            }

            container.innerHTML = currentRouteDspState.chain.map((proc, idx) => {
                let paramsHtml = '';
                const params = proc.params || {};
                for (const [pKey, pVal] of Object.entries(params)) {
                    paramsHtml += `
                        <div class="control-row">
                            <label>${pKey}</label>
                            <input type="number" step="0.01" value="${pVal}" onchange="updateProcessorParam(${idx}, '${pKey}', this.value)">
                        </div>
                    `;
                }

                let arrowHtml = idx < currentRouteDspState.chain.length - 1 ? '<div class="chain-arrow">&darr;</div>' : '';

                return `
                    <div class="dsp-processor-card">
                        <div class="dsp-processor-header">
                            <span>#${idx + 1}: ${proc.type.toUpperCase()}</span>
                            <button class="remove-btn" onclick="removeProcessor(${idx})">Remove</button>
                        </div>
                        <div class="dsp-processor-params">
                            ${paramsHtml || '<span style="font-size:10px; color:var(--text-dim);">No parameters</span>'}
                        </div>
                    </div>
                    ${arrowHtml}
                `;
            }).join('');
        }

        async function postDspState() {
            if (!editingRouteId) return;
            try {
                await fetchAPI(`/api/routes/${editingRouteId}/dsp`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(currentRouteDspState)
                });
            } catch (e) {
                showError('Failed to update DSP state: ' + e.message);
            }
        }

        function onDspActiveChange() {
            currentRouteDspState.active = $('modal-dsp-active').value === 'true';
            postDspState();
        }

        function onDspGainChange() {
            currentRouteDspState.gain = parseFloat($('modal-dsp-gain').value) || 1.0;
            postDspState();
        }

        function updateProcessorParam(index, key, value) {
            const numVal = parseFloat(value);
            if (currentRouteDspState.chain[index] && currentRouteDspState.chain[index].params) {
                currentRouteDspState.chain[index].params[key] = isNaN(numVal) ? value : numVal;
                postDspState();
            }
        }

        function addProcessorToChain() {
            const type = $('new-processor-type').value;
            let defaultParams = {};
            if (type === 'gain') defaultParams = { gain: 1.0 };
            else if (type === 'compressor') defaultParams = { threshold: -20.0, ratio: 4.0 };
            else if (type === 'eq') defaultParams = { frequency: 1000.0, q: 1.0, gain: 0.0 };
            else if (type === 'limiter') defaultParams = { ceiling: -0.1 };

            currentRouteDspState.chain.push({ type: type, params: defaultParams });
            renderDspChain();
            postDspState();
        }

        function removeProcessor(index) {
            currentRouteDspState.chain.splice(index, 1);
            renderDspChain();
            postDspState();
        }

        async function saveRoute() {
            const gain = $('modal-gain').value;
            const enabled = $('modal-enabled').value === '1';
            try {
                await fetchAPI(`/api/routes/update?id=${editingRouteId}&enabled=${enabled ? 1 : 0}&gain=${gain}`, { method: 'POST' });
                await postDspState();
                closeModal();
                await loadGraph();
            } catch (e) {
                alert('Update failed: ' + e.message);
            }
        }

        async function deleteRoute() {
            try {
                await fetchAPI(`/api/routes/${editingRouteId}`, { method: 'DELETE' });
                closeModal();
                await loadGraph();
            } catch (e) {
                alert('Delete failed: ' + e.message);
            }
        }

        async function updateMeters() {
            try {
                const data = await fetchAPI('/api/meters');
                cachedMeters.forEach(m => {
                    let meter = null;
                    if (m.epId.includes('/capture')) {
                        if (data.capture && data.capture[m.epId] && data.capture[m.epId][m.ch]) {
                            meter = data.capture[m.epId][m.ch];
                        }
                    } else if (m.epId.includes('/playback')) {
                        if (data.playback && data.playback[m.epId] && data.playback[m.epId][m.ch]) {
                            meter = data.playback[m.epId][m.ch];
                        }
                    }

                    if (meter) {
                        const width = Math.max(0, Math.min(100, (meter.rms_db + 60) * 100 / 60)) + '%';
                        m.fillEl.style.width = width;
                        if (m.peakEl) m.peakEl.classList.toggle('active', meter.clipped);
                    }
                });
            } catch (e) { console.error("Meter update error:", e); }
        }

        async function applyTone() {
            try {
                await fetchAPI(`/api/tone?enabled=${$('tone-enabled').value}&frequency=${$('tone-freq').value}&amplitude=${$('tone-amp').value}`, { method: 'POST' });
            } catch (e) { alert(e.message); }
        }

        async function applyDSP() {
            try {
                await fetchAPI(`/api/dsp?gain=${$('dsp-gain').value}`, { method: 'POST' });
            } catch (e) { alert(e.message); }
        }

        async function resetClips() { try { await fetchAPI('/api/reset_clips?all=1', { method: 'POST' }); } catch (e) {} }
        async function saveSettings() { try { await fetchAPI('/api/settings/save', { method: 'POST' }); alert('Settings Saved'); } catch (e) { alert(e.message); } }
        async function refreshAll() { await Promise.all([loadGraph(), loadDevices()]); }

        // Setup ResizeObserver to replace arbitrary timeouts and ensure cables redraw when layout settles
        const viewportObserver = new ResizeObserver(() => {
            drawCables();
        });

        window.onresize = drawCables;
        setInterval(updateMeters, 100);

        async function init() {
            const viewport = $('patchbay-viewport');
            if (viewport) viewportObserver.observe(viewport);

            Promise.allSettled([
                loadDevices(),
                loadGraph()
            ]).then(() => {
                if ($('status'))$('status').textContent = 'Ready';
            });
        }
        init();
    </script>
</body>
</html>
