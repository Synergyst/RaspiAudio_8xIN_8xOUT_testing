<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CM5 Audio - Device Scan</title>
    <style>
        :root {
            --bg: #0f111a;
            --card-bg: #1a1c23;
            --border: #2e3440;
            --text: #eceff4;
            --dim: #d8dee9;
            --accent: #88c0d0;
            --green: #a3be8c;
            --red: #bf616a;
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { color: var(--accent); margin-bottom: 30px; }
        .container {
            width: 100%;
            max-width: 900px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }
        .device-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            transition: transform 0.2s, border-color 0.2s;
            position: relative;
        }
        .device-card.active {
            border-color: var(--green);
            box-shadow: 0 0 10px rgba(163, 190, 140, 0.2);
        }
        .device-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent);
        }
        .device-name {
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 10px;
            display: block;
            color: var(--text);
        }
        .detail {
            font-size: 13px;
            color: var(--dim);
            margin: 4px 0;
            display: flex;
            justify-content: space-between;
        }
        .detail span { color: var(--accent); font-family: monospace; }
        .badge {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 10px;
            padding: 3px 8px;
            border-radius: 10px;
            text-transform: uppercase;
            font-weight: bold;
        }
        .badge-capture { background: #4c566a; color: #eceff4; }
        .badge-playback { background: #5e81ac; color: #eceff4; }
        .btn {
            width: 100%;
            margin-top: 15px;
            padding: 10px;
            border: 0;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }
        .btn-activate { background: var(--accent); color: var(--bg); }
        .btn-activate:hover { background: #a3c2d1; }
        .btn-deactivate { background: var(--red); color: white; }
        .btn-deactivate:hover { background: #d0878a; }
        #refresh-btn {
            margin-bottom: 30px;
            padding: 12px 24px;
            background: var(--highlight, #5e81ac);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }
        .status-msg {
            margin-bottom: 20px;
            font-size: 14px;
            color: var(--dim);
        }
    </style>
</head>
<body>

    <h1>Hardware Device Scan</h1>
    <button id="refresh-btn" onclick="scan()">SCAN DEVICES</button>
    <div id="status" class="status-msg">Ready to scan...</div>
    <div id="device-grid" class="container"></div>

    <script>
        async function scan() {
            const grid = document.getElementById('device-grid');
            const status = document.getElementById('status');
            
            status.textContent = 'Scanning ALSA hardware...';
            grid.innerHTML = '';

            try {
                // 1. Get all available devices
                const devices = await fetch('/api/devices').then(r => r.json());
                
                // 2. Get currently active devices to mark them
                const graph = await fetch('/api/graph').then(r => r.json());
                const activeIds = new Set(
                    graph.endpoints
                        .filter(e => e.id.startsWith('hardware/'))
                        .map(e => e.id.replace('hardware/', '').replace('/capture', '').replace('/playback', ''))
                );

                status.textContent = `Found ${devices.length} devices.`;

                devices.forEach(dev => {
                    const isActive = activeIds.has(dev.id);
                    const card = document.createElement('div');
                    card.className = `device-card ${isActive ? 'active' : ''}`;
                    card.id = `dev-${dev.id}`;
                    
                    card.innerHTML = `
                        <div class="badge ${dev.is_capture ? 'badge-capture' : 'badge-playback'}">
                            ${dev.is_capture ? 'Input' : 'Output'}
                        </div>
                        <span class="device-name">${dev.name}</span>
                        <div class="detail">ID: <span>${dev.id}</span></div>
                        <div class="detail">Channels: <span>${dev.channels}</span></div>
                        <div class="detail">Rate: <span>${dev.sample_rate}Hz</span></div>
                        <button class="btn ${isActive ? 'btn-deactivate' : 'btn-activate'}" 
                                onclick="toggleDevice('${dev.id}', ${isActive})">
                            ${isActive ? 'DEACTIVATE' : 'ACTIVATE'}
                        </button>
                    `;
                    grid.appendChild(card);
                });
            } catch (e) {
                status.textContent = 'Error: ' + e.message;
                console.error(e);
            }
        }

        async function toggleDevice(id, isActive) {
            const endpoint = isActive ? '/api/devices/deactivate' : '/api/devices/activate';
            try {
                const res = await fetch(`${endpoint}?id=${encodeURIComponent(id)}`, { method: 'POST' });
                if (!res.ok) throw new Error(await res.text());
                
                // Update UI immediately
                const card = document.getElementById(`dev-${id}`);
                const btn = card.querySelector('.btn');
                
                if (isActive) {
                    card.classList.remove('active');
                    btn.className = 'btn btn-activate';
                    btn.textContent = 'ACTIVATE';
                } else {
                    card.classList.add('active');
                    btn.className = 'btn btn-deactivate';
                    btn.textContent = 'DEACTIVATE';
                }
            } catch (e) {
                alert('Action failed: ' + e.message);
            }
        }

        // Initial scan
        scan();
    </script>
</body>
</html>
